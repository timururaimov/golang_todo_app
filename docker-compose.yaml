services:
  todoapp:
    build:
      context: .
      dockerfile: cmd/todoapp/Dockerfile
    container_name: todoapp
    environment:
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-30s}
      POSTGRES_HOST: todoapp-postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_TIMEOUT: ${POSTGRES_TIMEOUT:-10s}
      LOGGER_LEVEL: ${LOGGER_LEVEL:-INFO}
      TIME_ZONE: ${TIME_ZONE:-UTC}
      LOGGER_FOLDER: /app/out/logs
    volumes:
      - ./out/logs:/app/out/logs
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      todoapp-postgres:
        condition: service_healthy

  todoapp-postgres:
    image: postgres:18.4-bookworm
    container_name: todoapp-env-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - ./out/pgdata:/var/lib/postgresql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  todoapp-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations:ro

  port-forward:
    image: alpine/socat:1.8.0.3
    container_name: todoapp-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:todoapp-postgres:5432
    ports:
      - "127.0.0.1:${POSTGRES_FORWARD_PORT:-5432}:5432"
    restart: always
    depends_on:
      todoapp-postgres:
        condition: service_healthy
